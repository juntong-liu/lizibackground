<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="黑色全屏粒子流场背景，支持鼠标扰动与点击脉冲效果">
  <title>粒子流场背景 | lizibackground</title>
  <style>
    :root {
      --bg: #020203;
      --text: rgba(230, 243, 255, 0.92);
      --muted: rgba(151, 175, 203, 0.6);
      --accent: #8ed8ff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(26, 51, 92, 0.2), transparent 32%),
        radial-gradient(circle at 80% 10%, rgba(47, 92, 145, 0.12), transparent 30%),
        radial-gradient(circle at 50% 80%, rgba(17, 34, 62, 0.28), transparent 44%),
        linear-gradient(180deg, #010102 0%, #020306 45%, #000000 100%);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle at center, black 25%, transparent 100%);
      opacity: 0.22;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .hud {
      position: fixed;
      left: clamp(20px, 3vw, 40px);
      top: clamp(20px, 3vw, 36px);
      z-index: 2;
      pointer-events: none;
      user-select: none;
      mix-blend-mode: screen;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 78px);
      line-height: 0.95;
      letter-spacing: 0.08em;
      text-shadow: 0 0 18px rgba(142, 216, 255, 0.16);
    }

    .subtitle {
      margin-top: 14px;
      max-width: 420px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .badge {
      position: fixed;
      right: clamp(18px, 3vw, 28px);
      bottom: clamp(18px, 3vw, 28px);
      z-index: 2;
      padding: 10px 14px;
      border: 1px solid rgba(142, 216, 255, 0.16);
      border-radius: 999px;
      background: rgba(7, 13, 22, 0.35);
      backdrop-filter: blur(10px);
      color: rgba(216, 232, 255, 0.8);
      font-size: 11px;
      letter-spacing: 0.2em;
      pointer-events: none;
      user-select: none;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
        0 0 32px rgba(31, 111, 255, 0.12);
    }

    .auth-shell {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: clamp(18px, 4vw, 52px);
      background: linear-gradient(
        90deg,
        rgba(2, 3, 7, 0.08) 0%,
        rgba(2, 3, 7, 0.24) 40%,
        rgba(2, 3, 7, 0.68) 72%,
        rgba(2, 3, 7, 0.86) 100%
      );
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }

    .auth-panel {
      width: min(90vw, 420px);
      padding: 30px clamp(20px, 2.4vw, 32px);
      border-radius: 22px;
      border: 1px solid rgba(163, 215, 255, 0.22);
      background:
        linear-gradient(165deg, rgba(15, 29, 50, 0.72), rgba(7, 14, 25, 0.84)),
        radial-gradient(circle at top right, rgba(78, 144, 255, 0.26), transparent 48%);
      box-shadow:
        0 30px 56px rgba(2, 8, 21, 0.62),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
        0 0 36px rgba(91, 167, 255, 0.2);
      backdrop-filter: blur(14px);
    }

    .auth-kicker {
      margin: 0;
      color: rgba(165, 202, 235, 0.92);
      letter-spacing: 0.2em;
      font-size: 11px;
    }

    .auth-title {
      margin: 10px 0 8px;
      font-size: clamp(22px, 3vw, 30px);
      line-height: 1.12;
      letter-spacing: 0.05em;
      color: rgba(237, 246, 255, 0.96);
      text-shadow: 0 0 20px rgba(124, 197, 255, 0.25);
    }

    .auth-desc {
      margin: 0 0 18px;
      font-size: 13px;
      color: rgba(178, 206, 232, 0.82);
      line-height: 1.6;
    }

    .auth-form { display: grid; gap: 12px; }

    .field-label {
      display: grid;
      gap: 7px;
      font-size: 12px;
      color: rgba(185, 211, 235, 0.88);
      letter-spacing: 0.06em;
    }

    .field-input {
      width: 100%;
      border: 1px solid rgba(170, 216, 255, 0.2);
      border-radius: 12px;
      background: rgba(5, 11, 21, 0.64);
      color: rgba(232, 244, 255, 0.96);
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .field-input::placeholder { color: rgba(177, 204, 230, 0.42); }

    .field-input:focus {
      border-color: rgba(135, 209, 255, 0.7);
      background: rgba(8, 17, 33, 0.8);
      box-shadow: 0 0 0 3px rgba(142, 216, 255, 0.14);
    }

    .remember-line {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: rgba(183, 211, 236, 0.88);
      user-select: none;
      cursor: pointer;
      margin-top: 2px;
    }

    .remember-line input {
      accent-color: #86cfff;
      width: 15px;
      height: 15px;
    }

    .login-btn {
      margin-top: 4px;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      letter-spacing: 0.12em;
      color: rgba(10, 17, 27, 0.95);
      background: linear-gradient(120deg, #8dd6ff, #7fc7ff 45%, #8f91ff);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 12px 26px rgba(59, 131, 255, 0.34);
    }

    .login-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
      box-shadow: 0 18px 34px rgba(59, 131, 255, 0.4);
    }

    .login-btn:active { transform: translateY(0); }

    .auth-tip {
      margin: 10px 0 0;
      font-size: 12px;
      color: rgba(170, 201, 230, 0.8);
    }

    .login-message {
      margin: 6px 0 0;
      min-height: 20px;
      font-size: 13px;
      color: rgba(140, 215, 255, 0.95);
    }

    .login-message.is-error { color: rgba(255, 153, 163, 0.95); }
    .login-message.is-success { color: rgba(145, 255, 206, 0.95); }

    body.auth-locked .hud,
    body.auth-locked .badge {
      opacity: 0.5;
      filter: saturate(0.9);
    }

    body.is-authenticated .auth-shell {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @media (max-width: 920px) {
      .auth-shell {
        justify-content: center;
        padding: 20px;
        background: linear-gradient(
          180deg,
          rgba(2, 3, 7, 0.52) 0%,
          rgba(2, 3, 7, 0.74) 52%,
          rgba(2, 3, 7, 0.88) 100%
        );
      }

      .auth-panel { width: min(100%, 460px); }
      .hud { left: 18px; right: 18px; }
      .subtitle { max-width: 72vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .auth-shell { transition: none; }
    }
  </style>
</head>
<body class="auth-locked">
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="hud">
    <div class="eyebrow">Neural Void</div>
    <h1>粒子<br>流场</h1>
    <p class="subtitle">移动鼠标扰动流场，点击释放脉冲与火花。登录后可完整交互。</p>
  </div>

  <div class="badge">深色模式</div>

  <section class="auth-shell" id="authShell" aria-label="登录">
    <div class="auth-panel">
      <p class="auth-kicker">安全访问</p>
      <h2 class="auth-title">登录入口</h2>
      <p class="auth-desc">输入账号与密码以解锁页面交互。</p>

      <form class="auth-form" id="loginForm" novalidate>
        <label class="field-label" for="usernameInput">
          账号
          <input class="field-input" id="usernameInput" name="username" autocomplete="username" placeholder="请输入账号" required>
        </label>

        <label class="field-label" for="passwordInput">
          密码
          <input class="field-input" id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        </label>

        <label class="remember-line" for="rememberInput">
          <input id="rememberInput" type="checkbox" name="remember">
          <span>记住密码</span>
        </label>

        <button class="login-btn" type="submit">进入页面</button>

        <p class="auth-tip">默认账号：admin · 默认密码：123456789</p>
        <p class="login-message" id="loginMessage" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <script src="js/particle-background.js"></script>
  <script src="js/auth-gate.js"></script>
  <script>
    const particleBg = new ParticleBackground(document.getElementById("scene"), {
      trailAlpha: 0.14,
      maxDist: 120,
    });

    particleBg.setInteractionEnabled(false);

    const authGate = new AuthGate({
      onSuccess() {
        particleBg.setInteractionEnabled(true);
        particleBg.emitPulse(window.innerWidth * 0.76, window.innerHeight * 0.48);
      },
    });
  </script>
</body>
</html>
